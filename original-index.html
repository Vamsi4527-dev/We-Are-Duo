<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duet</title>
  <!-- Blank icon so the browser does not look for a file that doesn't exist -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <main class="splash">
    <div class="splash__inner">

      <!-- App name is the page's main heading -->
      <h1 class="logo logo--xl logo--animated">
        <span class="logo__mark" aria-hidden="true"></span>
        <span>Duet</span>
      </h1>

      <p class="splash__tagline">Private conversations for two.</p>

      <!-- Indeterminate loading bar (animated with CSS only) -->
      <div class="loader" role="progressbar" aria-label="Loading Duet"></div>

      <a class="btn btn--secondary" href="login.html">Continue to sign in</a>

      <p class="demo-note">
        <span class="demo-badge">Demo</span>
        A real app would move on to sign-in by itself. That needs JavaScript,
        so this prototype gives you a link instead.
      </p>

    </div>
  </main>

</body>
</html>
